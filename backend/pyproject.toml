[project]
name = "backend"
version = "0.1.0"
description = "Shortcraft API: projects, edit plans, uploads and jobs"
readme = "README.md"
authors = [
    { name = "alihassan-4dev", email = "alihassan.4dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.118",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "fakeredis>=2.40.0",
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: fast tests of one module (no HTTP app)",
    "integration: tests that drive the HTTP API end to end",
    "ffmpeg: needs the ffmpeg/ffprobe binaries (skipped when missing)",
    "live_openai: calls the real OpenAI API (skipped unless OPENAI_API_KEY and RUN_LIVE_AI=1)",
]
