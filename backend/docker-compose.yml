# Optional prod-like local services. The API itself runs on the host (uv run ...).
# Use with: DATABASE_URL=postgresql+asyncpg://shortcraft:shortcraft@localhost:5432/shortcraft
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shortcraft
      POSTGRES_PASSWORD: shortcraft
      POSTGRES_DB: shortcraft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortcraft -d shortcraft"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
